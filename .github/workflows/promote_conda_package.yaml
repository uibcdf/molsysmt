name: Promote an exact conda package

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the published release
        required: true
        type: string
      version:
        description: Three-part release version
        required: true
        type: string
      target:
        description: Native platform of this exact ABI3 artifact
        required: true
        type: choice
        options: [linux-64, linux-aarch64, osx-64, osx-arm64, win-64]
      filename:
        description: Exact validated ABI3 filename in the selected subdir
        required: true
        type: string
      build_number:
        description: Exact validated staging build number
        required: true
        type: number
      sha256:
        description: Independently verified staging artifact SHA-256
        required: true
        type: string
      pair_run_id:
        description: Successful 20-cell installed-pair validation run ID
        required: true
        type: string
      molsysviewer_version:
        description: Exact Viewer version in that installed-pair run
        required: true
        type: string
      molsysviewer_build_number:
        description: Exact Viewer build in that installed-pair run
        required: true
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: molsysmt-conda-${{ inputs.version }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote one digest-verified native artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Validate release identity and installed-pair gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          FILENAME: ${{ inputs.filename }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          PAIR_RUN_ID: ${{ inputs.pair_run_id }}
          VIEWER_VERSION: ${{ inputs.molsysviewer_version }}
          VIEWER_BUILD: ${{ inputs.molsysviewer_build_number }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PAIR_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VIEWER_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VIEWER_BUILD" =~ ^[0-9]+$ ]]
          case "$TARGET" in linux-64|linux-aarch64|osx-64|osx-arm64|win-64) ;; *) exit 1 ;; esac
          prefix="molsysmt-${RELEASE_VERSION}-pyabi3h"
          suffix="_${BUILD_NUMBER}.conda"
          [[ "$FILENAME" == "$prefix"*"$suffix" ]]
          hash="${FILENAME#"$prefix"}"
          hash="${hash%"$suffix"}"
          [[ "$hash" =~ ^[0-9a-f]+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .draft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .prerelease)" = false
          python devtools/conda-build/release_route.py \
            --version "$RELEASE_VERSION" --event release \
            --github-output "$RUNNER_TEMP/conda-route-output"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_RUN_ID" --jq .head_sha)" = "$CANDIDATE_SHA"
          run_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_RUN_ID" --jq .path)"
          [[ "$run_path" == .github/workflows/validate_conda_staging.yaml* ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_RUN_ID/jobs?per_page=100" --jq .total_count)" = 21
          expected_run_title="MT $RELEASE_VERSION build $BUILD_NUMBER + Viewer $VIEWER_VERSION build $VIEWER_BUILD | Python 3.14 | all"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_RUN_ID" --jq .display_title)" = "$expected_run_title"

      - name: Set up the authenticated Anaconda client
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: promote
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Promote the exact staged artifact
        id: promotion
        uses: uibcdf/action-build-and-upload-conda-packages/promote@v2.2.2
        with:
          package-spec: uibcdf/molsysmt/${{ inputs.version }}/${{ inputs.target }}/${{ inputs.filename }}
          expected-sha256: ${{ inputs.sha256 }}
          from-label: staging
          to-label: main
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}

      - name: Retain the bounded promotion receipt
        if: ${{ always() && steps.promotion.outputs.receipt != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysmt-conda-promotion-${{ inputs.version }}-${{ inputs.target }}
          path: ${{ steps.promotion.outputs.receipt }}
          if-no-files-found: error
          retention-days: 30

      - name: Independently verify the public package record
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          FILENAME: ${{ inputs.filename }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          python3 devtools/conda-build/verify_public_package.py \
            --package molsysmt \
            --version "$RELEASE_VERSION" \
            --subdir "$TARGET" \
            --filename "$FILENAME" \
            --sha256 "$EXPECTED_SHA256"
