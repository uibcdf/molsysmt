name: Promote an exact conda package

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the published release
        required: true
        type: string
      version:
        description: Three-part release version
        required: true
        type: string
      target:
        description: Native platform of this exact ABI3 artifact
        required: true
        type: choice
        options: [linux-64, linux-aarch64, osx-arm64, win-64]
      filename:
        description: Exact validated ABI3 filename in the selected subdir
        required: true
        type: string
      build_number:
        description: Exact validated staging build number
        required: true
        type: number
      sha256:
        description: Independently verified staging artifact SHA-256
        required: true
        type: string
      pair_run_id:
        description: Successful 16-cell installed-pair validation run ID
        required: true
        type: string
      molsysviewer_version:
        description: Exact Viewer version in that installed-pair run
        required: true
        type: string
      molsysviewer_build_number:
        description: Exact Viewer build in that installed-pair run
        required: true
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: molsysmt-conda-${{ inputs.version }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote one digest-verified native artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Validate release identity and installed-pair gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          FILENAME: ${{ inputs.filename }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          PAIR_RUN_ID: ${{ inputs.pair_run_id }}
          VIEWER_VERSION: ${{ inputs.molsysviewer_version }}
          VIEWER_BUILD: ${{ inputs.molsysviewer_build_number }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PAIR_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VIEWER_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VIEWER_BUILD" =~ ^[0-9]+$ ]]
          case "$TARGET" in linux-64|linux-aarch64|osx-arm64|win-64) ;; *) exit 1 ;; esac
          prefix="molsysmt-${RELEASE_VERSION}-pyabi3h"
          suffix="_${BUILD_NUMBER}.conda"
          [[ "$FILENAME" == "$prefix"*"$suffix" ]]
          hash="${FILENAME#"$prefix"}"
          hash="${hash%"$suffix"}"
          [[ "$hash" =~ ^[0-9a-f]+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .draft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .prerelease)" = false
          python devtools/conda-build/release_route.py \
            --version "$RELEASE_VERSION" --event release \
            --github-output "$RUNNER_TEMP/conda-route-output"

      - name: Verify every declared installed-pair cell and evidence step
        id: installed_matrix
        uses: uibcdf/molsyssuite/.github/actions/verify-installed-matrix@778c918b37a1c2c2fa03ed387a000bff0edf1b3d
        with:
          repository: uibcdf/molsysmt
          run-id: ${{ inputs.pair_run_id }}
          candidate-sha: ${{ inputs.candidate_sha }}
          workflow: .github/workflows/validate_conda_staging.yaml
          title: 'MT ${{ inputs.version }} build ${{ inputs.build_number }} + Viewer ${{ inputs.molsysviewer_version }} build ${{ inputs.molsysviewer_build_number }} | Python 3.14 | all'
          profile: '{"platforms":["linux-64","linux-aarch64","osx-arm64","win-64"],"python_versions":["3.11","3.12","3.13","3.14"],"prepare_job":"Validate the requested package versions","required_steps":["Install the selected package pair","Validate versions, provenance, native code, BCIF, PDB text, and viewer resources","Record the exact environment","Retain the environment record"]}'

      - name: Retain independent installed-matrix evidence
        if: ${{ always() && steps.installed_matrix.outputs.evidence-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysmt-installed-matrix-${{ inputs.version }}
          path: ${{ steps.installed_matrix.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Set up the authenticated Anaconda client
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: promote
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Promote the exact staged artifact
        id: promotion
        uses: uibcdf/action-build-and-upload-conda-packages/promote@v2.2.2
        with:
          package-spec: uibcdf/molsysmt/${{ inputs.version }}/${{ inputs.target }}/${{ inputs.filename }}
          expected-sha256: ${{ inputs.sha256 }}
          from-label: staging
          to-label: main
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}

      - name: Retain the bounded promotion receipt
        if: ${{ always() && steps.promotion.outputs.receipt != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysmt-conda-promotion-${{ inputs.version }}-${{ inputs.target }}
          path: ${{ steps.promotion.outputs.receipt }}
          if-no-files-found: error
          retention-days: 30

      - name: Independently verify the public package record
        id: public_verification
        uses: uibcdf/molsyssuite/.github/actions/verify-public-conda@399d33a4ee0da148571cba7cfc004e3f3a2e71e7
        with:
          package: molsysmt
          version: ${{ inputs.version }}
          subdir: ${{ inputs.target }}
          filename: ${{ inputs.filename }}
          sha256: ${{ inputs.sha256 }}

      - name: Retain independent public verification evidence
        if: ${{ always() && steps.public_verification.outputs.evidence-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysmt-independent-public-conda-${{ inputs.version }}
          path: ${{ steps.public_verification.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
