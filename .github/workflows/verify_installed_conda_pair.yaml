name: Verify existing installed Conda pair evidence
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing completed installed-pair run; does not rerun tests
        required: true
        type: string
      candidate_sha:
        description: Full MolSysMT source SHA of that run
        required: true
        type: string
      title:
        description: Exact expected version/build pair title
        required: true
        type: string
      profile:
        description: Exact matrix descriptor; historical targets remain addressable
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the existing native matrix without executing its tests
        id: installed_matrix
        uses: uibcdf/molsyssuite/.github/actions/verify-installed-matrix@778c918b37a1c2c2fa03ed387a000bff0edf1b3d
        with:
          repository: uibcdf/molsysmt
          run-id: ${{ inputs.run_id }}
          candidate-sha: ${{ inputs.candidate_sha }}
          workflow: .github/workflows/validate_conda_staging.yaml
          title: ${{ inputs.title }}
          profile: ${{ inputs.profile }}
      - name: Retain independent installed-matrix evidence
        if: ${{ always() && steps.installed_matrix.outputs.evidence-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysmt-installed-matrix-evidence
          path: ${{ steps.installed_matrix.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
