name: Verify Zenodo release

on:
  release:
    types: [published]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact public tag; leave empty to scan all covered releases"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Probe archived releases
    uses: uibcdf/molsyssuite/.github/workflows/verify-zenodo-releases.yaml@2cc2d9bfe80f14a981d40bc109ecdf2af39b693b
    with:
      concept-doi: 10.5281/zenodo.1298752
      since: "2026-09-25T00:00:00Z"
      tag: ${{ github.event.release.tag_name || inputs.version || '' }}
