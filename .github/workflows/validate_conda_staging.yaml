name: Validate conda package pair
run-name: MT ${{ inputs.molsysmt_version }} build ${{ inputs.molsysmt_build_number }} + Viewer ${{ inputs.molsysviewer_version }} build ${{ inputs.molsysviewer_build_number }} | Python ${{ inputs.python_max }} | ${{ inputs.target }}${{ inputs.package_source == 'public' && ' | public' || '' }}

on:
  workflow_dispatch:
    inputs:
      molsysmt_version:
        description: Exact MolSysMT version in the selected channel
        required: true
        default: 0.22.4
        type: string
      molsysviewer_version:
        description: Exact MolSysViewer version in the selected channel
        required: true
        default: 0.23.4
        type: string
      molsysmt_build_number:
        description: Exact MolSysMT ABI3 build number
        required: true
        default: 0
        type: number
      molsysviewer_build_number:
        description: Exact MolSysViewer noarch build number
        required: true
        default: 0
        type: number
      python_max:
        description: Highest Python minor to validate
        required: true
        default: '3.14'
        type: choice
        options:
          - '3.13'
          - '3.14'
      target:
        description: Native platform to validate, or all platforms
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-64
          - linux-aarch64
          - osx-64
          - osx-arm64
          - win-64
      package_source:
        description: Select staging or the public UIBCDF channel
        required: true
        default: staging
        type: choice
        options:
          - staging
          - public

permissions:
  contents: read

jobs:
  prepare:
    name: Validate the requested package versions
    runs-on: ubuntu-24.04
    outputs:
      target_matrix: ${{ steps.targets.outputs.target_matrix }}
      python_matrix: ${{ steps.python.outputs.python_matrix }}
    steps:
      - name: Require stable package versions
        shell: bash
        env:
          MOLSYS_MT_VERSION: ${{ inputs.molsysmt_version }}
          MOLSYS_VIEWER_VERSION: ${{ inputs.molsysviewer_version }}
          MOLSYS_MT_BUILD: ${{ inputs.molsysmt_build_number }}
          MOLSYS_VIEWER_BUILD: ${{ inputs.molsysviewer_build_number }}
        run: |
          [[ "$MOLSYS_MT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$MOLSYS_VIEWER_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$MOLSYS_MT_BUILD" =~ ^[0-9]+$ ]]
          [[ "$MOLSYS_VIEWER_BUILD" =~ ^[0-9]+$ ]]

      - name: Select native platforms
        id: targets
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          case "$REQUESTED_TARGET" in
            all) matrix='[{"platform":"linux-64","runner":"ubuntu-24.04"},{"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"platform":"osx-64","runner":"macos-15-intel"},{"platform":"osx-arm64","runner":"macos-15"},{"platform":"win-64","runner":"windows-2025"}]' ;;
            linux-64) matrix='[{"platform":"linux-64","runner":"ubuntu-24.04"}]' ;;
            linux-aarch64) matrix='[{"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"}]' ;;
            osx-64) matrix='[{"platform":"osx-64","runner":"macos-15-intel"}]' ;;
            osx-arm64) matrix='[{"platform":"osx-arm64","runner":"macos-15"}]' ;;
            win-64) matrix='[{"platform":"win-64","runner":"windows-2025"}]' ;;
            *) exit 1 ;;
          esac
          echo "target_matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Select the Python matrix
        id: python
        shell: bash
        env:
          PYTHON_MAX: ${{ inputs.python_max }}
        run: |
          case "$PYTHON_MAX" in
            3.13) matrix='["3.11","3.12","3.13"]' ;;
            3.14) matrix='["3.11","3.12","3.13","3.14"]' ;;
            *) exit 1 ;;
          esac
          echo "python_matrix=$matrix" >> "$GITHUB_OUTPUT"

  validate:
    name: ${{ matrix.target.platform }} · Python ${{ matrix.python }}
    needs: prepare
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.target_matrix) }}
        python: ${{ fromJSON(needs.prepare.outputs.python_matrix) }}

    steps:
      - name: Check out validation tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the selected package pair
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: staging-test
          condarc: |
            channels:
              - ${{ inputs.package_source == 'staging' && 'uibcdf/label/staging' || 'uibcdf' }}
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python }}
            molsysmt=${{ inputs.molsysmt_version }}=pyabi3*_${{ inputs.molsysmt_build_number }}
            molsysviewer=${{ inputs.molsysviewer_version }}=py_${{ inputs.molsysviewer_build_number }}

      - name: Validate versions, provenance, native code, BCIF, PDB text, and viewer resources
        shell: bash -el {0}
        run: >-
          python devtools/scripts/validate_conda_staging.py
          --molsysmt-version "${{ inputs.molsysmt_version }}"
          --molsysviewer-version "${{ inputs.molsysviewer_version }}"
          ${{ inputs.package_source == 'staging' && '--require-staging-provenance' || '--require-public-provenance' }}

      - name: Record the exact environment
        shell: bash -el {0}
        run: '"$MAMBA_EXE" env export --name staging-test --explicit > conda-${{ matrix.target.platform }}-py${{ matrix.python }}.txt'

      - name: Retain the environment record
        uses: actions/upload-artifact@v7
        with:
          name: conda-${{ inputs.package_source }}-${{ matrix.target.platform }}-py${{ matrix.python }}
          path: conda-${{ matrix.target.platform }}-py${{ matrix.python }}.txt
          if-no-files-found: error
          retention-days: 30
