name: Build and upload conda packages

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to build into the staging label
        required: true
        type: string
      version:
        description: Candidate version (for example, 0.22.0)
        required: true
        default: 0.22.4
        type: string
      target:
        description: Native platform to build, or all platforms
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-64
          - linux-aarch64
          - osx-64
          - osx-arm64
          - win-64
      build_number:
        description: Staging build number; increment only to supersede a defective artifact
        required: true
        default: 0
        type: number

permissions:
  contents: read

jobs:
  prepare:
    name: Validate the immutable candidate identity
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.candidate.outputs.matrix }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - name: Validate staging inputs or the release tag
        id: candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          all_targets='{"target":[{"platform":"linux-64","runner":"ubuntu-24.04"},{"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"platform":"osx-64","runner":"macos-15-intel"},{"platform":"osx-arm64","runner":"macos-15"},{"platform":"win-64","runner":"windows-2025"}]}'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$INPUT_BUILD_NUMBER" =~ ^[0-9]+$ ]]
            case "$INPUT_TARGET" in
              all) matrix="$all_targets" ;;
              linux-64) matrix='{"target":[{"platform":"linux-64","runner":"ubuntu-24.04"}]}' ;;
              linux-aarch64) matrix='{"target":[{"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"}]}' ;;
              osx-64) matrix='{"target":[{"platform":"osx-64","runner":"macos-15-intel"}]}' ;;
              osx-arm64) matrix='{"target":[{"platform":"osx-arm64","runner":"macos-15"}]}' ;;
              win-64) matrix='{"target":[{"platform":"win-64","runner":"windows-2025"}]}' ;;
              *) exit 1 ;;
            esac
          else
            [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            matrix="$all_targets"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Resolve the candidate before fan-out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.event.release.tag_name }}

      - name: Set up Python for route validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Select the committed Conda release route
        id: route
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          python devtools/conda-build/release_route.py \
            --version "$RELEASE_VERSION" --event "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

  build-and-publish:
    name: ${{ matrix.target.platform }} · one ABI3 artifact
    needs: prepare
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.event.release.tag_name }}

      - name: Verify the staging candidate and create an ephemeral version tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git tag "$RELEASE_VERSION" HEAD

      - name: Set up the staging build environment
        if: github.event_name == 'workflow_dispatch'
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Set up the direct public build environment
        if: github.event_name == 'release' && needs.prepare.outputs.route == 'direct'
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Verify the derived package version
        if: github.event_name == 'workflow_dispatch' || needs.prepare.outputs.route == 'direct'
        shell: bash -el {0}
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          test "$(python -m versioningit)" = "$EXPECTED_VERSION"

      - name: Build and publish the staging platform
        id: conda_staging
        if: github.event_name == 'workflow_dispatch'
        uses: uibcdf/action-build-and-upload-conda-packages@v2.1.0
        env:
          MOLSYSMT_CONDA_ABI3: "true"
          MOLSYSMT_CONDA_BUILD_NUMBER: ${{ inputs.build_number }}
        with:
          meta_yaml_dir: devtools/conda-build
          user: uibcdf
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
          label: staging
          evidence_matrix_index: ${{ strategy.job-index }}
          conda_build_args: >-
            --package-format .conda
            --no-test
            --exclusive-config-file conda_build_config_abi3.yaml

      - name: Build, test, and publish an unstaged release platform
        id: conda_release
        if: github.event_name == 'release' && needs.prepare.outputs.route == 'direct'
        uses: uibcdf/action-build-and-upload-conda-packages@v2.1.0
        env:
          MOLSYSMT_CONDA_ABI3: "true"
          MOLSYSMT_CONDA_BUILD_NUMBER: 0
        with:
          meta_yaml_dir: devtools/conda-build
          user: uibcdf
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
          label: main
          evidence_matrix_index: ${{ strategy.job-index }}
          conda_build_args: >-
            --package-format .conda
            --exclusive-config-file conda_build_config_abi3.yaml

      - name: Report the staged-release promotion boundary
        if: github.event_name == 'release' && needs.prepare.outputs.route == 'staged'
        shell: bash
        run: |
          echo '::notice::This version was staged; no package is rebuilt or uploaded by the Release event.'
          echo 'Promote the exact five digest-verified ABI3 files through the separate promotion route.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging producer evidence
        if: ${{ always() && steps.conda_staging.outputs.evidence_path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.conda_staging.outputs.evidence_artifact_name }}
          path: ${{ steps.conda_staging.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload release producer evidence
        if: ${{ always() && steps.conda_release.outputs.evidence_path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.conda_release.outputs.evidence_artifact_name }}
          path: ${{ steps.conda_release.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
