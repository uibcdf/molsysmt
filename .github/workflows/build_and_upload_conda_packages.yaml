name: Build and upload conda packages

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to build into the staging label
        required: true
        type: string
      version:
        description: Candidate version (for example, 0.22.0)
        required: true
        default: 0.22.0
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate the immutable candidate identity
    runs-on: ubuntu-24.04
    steps:
      - name: Validate staging inputs or the release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi

  build-and-publish:
    name: ${{ matrix.target.platform }} · Python 3.11–3.13
    needs: prepare
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - {platform: linux-64, runner: ubuntu-24.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          - {platform: osx-64, runner: macos-15-intel}
          - {platform: osx-arm64, runner: macos-15}
          - {platform: win-64, runner: windows-2025}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.event.release.tag_name }}

      - name: Verify the staging candidate and create an ephemeral version tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git tag "$RELEASE_VERSION" HEAD

      - name: Set up the conda build environment
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Verify the derived package version
        shell: bash -el {0}
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          test "$(python -m versioningit)" = "$EXPECTED_VERSION"

      - name: Build and publish the staging platform
        if: github.event_name == 'workflow_dispatch'
        uses: uibcdf/action-build-and-upload-conda-packages@v2.0.1
        env:
          MOLSYSMT_CONDA_BUILD_NUMBER: 0
        with:
          meta_yaml_dir: devtools/conda-build
          user: uibcdf
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
          label: staging
          conda_build_args: --package-format .conda --no-test

      - name: Build, test, and publish the release platform
        if: github.event_name == 'release'
        uses: uibcdf/action-build-and-upload-conda-packages@v2.0.1
        env:
          MOLSYSMT_CONDA_BUILD_NUMBER: 1
        with:
          meta_yaml_dir: devtools/conda-build
          user: uibcdf
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
          label: main
          conda_build_args: --package-format .conda
