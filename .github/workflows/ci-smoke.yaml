name: CI smoke

# Runs on every push and pull request to main (unless [skip ci] is set).
# Only executes the smoke test suite (~4 tests, <5 min).
# Purpose: fast signal that nothing is catastrophically broken.

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.ipynb'
      - 'docs/**'
      - 'paper/**'
      - 'examples/**'
      - 'logos/**'
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.ipynb'
      - 'docs/**'
      - 'paper/**'
      - 'examples/**'
      - 'logos/**'
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test — ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    if: >
      !(
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'skip-ci'))
      )
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 15
    concurrency:
      group: ci-smoke-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.14" }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: uname -a

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.cfg.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
            # Temporary runtime fence; removal requires #402 qualification.
            pinned_packages:
              - mkl<2026.2
          create-args: >-
            python=${{ matrix.cfg.python-version }}

      - name: Select the pinned minimal Rust toolchain
        shell: bash -l {0}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version

      - name: Install package
        shell: bash -l {0}
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          set -euo pipefail
          python -m pip install --no-deps \
            -r devtools/controlled_sources.txt \
            git+https://github.com/uibcdf/molsysviewer@deaba4cbea43015859544b1b393ecbe02dd2ee19
          python -m pip install --editable . --no-deps

      - name: Validate controlled dependency versions
        shell: bash -l {0}
        run: python devtools/scripts/validate_controlled_dependencies.py

      - name: Test import
        shell: bash -l {0}
        run: |
          cd
          python -c "from argdigest import Domain, UnknownArgumentError"
          python -c "import molsysmt; print('Version:', molsysmt.__version__)"

      - name: Validate public API stability against parent
        shell: bash -l {0}
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            python devtools/scripts/validate_public_api_stability.py --base HEAD~1
          fi

      - name: Validate docstrings bidirectionally
        shell: bash -l {0}
        run: python devtools/scripts/validate_docstrings.py

      - name: Validate form contracts
        shell: bash -l {0}
        run: python devtools/scripts/validate_form_adapters.py

      - name: Enforce the Rust-only runtime
        shell: bash -l {0}
        run: python devtools/scripts/audit_numba_surface.py --require-zero

      - name: Run test suite
        shell: bash -l {0}
        run: |
          # Keep this bounded tier aligned with devtools/tests/run_tiers.sh smoke.
          python -m pytest --receptor=ci -q \
            tests/element/component/test_get_component_index.py \
            tests/topology/get_covalent_blocks/test_get_covalent_blocks_from_molsysmt_MolSys.py \
            tests/pbc/get_lengths_and_angles_from_box/test_get_lengths_and_angles_from_box.py \
            tests/structure/get_rmsd/test_get_rmsd_from_molsysmt_MolSys.py \
            tests/structure/test_distance_family_contract.py \
            tests/form/string_amino_acids_3/test_biopython_codec.py \
            tests/structure/principal_component_analysis/test_weighted_contract.py \
            tests/structure/center/test_center_contract.py \
            tests/documentation/test_center_examples.py \
            tests/structure/move_away/test_move_away_contract.py \
            tests/structure/flip/test_reflection_contract.py \
            tests/structure/get_center/test_get_center_extended.py::test_empty_atom_population_raises_argument_error_before_group_dispatch \
            tests/documentation/test_move_away_examples.py \
            tests/structure/align/test_sequence_alignment_contract.py \
            tests/documentation/test_sequence_alignment_examples.py \
            tests/basic/test_file_copy.py \
            tests/basic/test_file_copy_lifecycle.py \
            tests/form/test_raw_file_copy.py \
            tests/structure/test_dihedral_edit_contract.py


      - name: Receive the bound MolSysViewer tools
        shell: bash -l {0}
        run: |
          # This integration tier uses the exact host installed above. A missing
          # receiver must fail before pytest can skip an optional-host module.
          python -c "import inspect; from molsysviewer.system_edits import SystemEditsManager; assert callable(SystemEditsManager.synchronize); assert 'rejection_check' in inspect.signature(SystemEditsManager.execute).parameters"
          python -m pytest --receptor=ci \
            tests/molsysviewer_molsysmt/test_read_tools.py \
            tests/molsysviewer_molsysmt/test_remove_tools.py \
            tests/molsysviewer_molsysmt/test_set_tools.py \
            tests/molsysviewer_molsysmt/test_conversion_tools.py \
            tests/molsysviewer_molsysmt/test_predicate_tools.py \
            tests/molsysviewer_molsysmt/test_identity_tools.py \
            tests/molsysviewer_molsysmt/test_topology_tools.py \
            tests/molsysviewer_molsysmt/test_topology_chemistry_tools.py \
            tests/molsysviewer_molsysmt/test_structure_tools.py \
            tests/molsysviewer_molsysmt/test_structure_comparison_tools.py \
            tests/molsysviewer_molsysmt/test_structure_relations_tools.py \
            tests/molsysviewer_molsysmt/test_structure_analysis_tools.py \
            tests/molsysviewer_molsysmt/test_structure_transform_tools.py \
            tests/molsysviewer_molsysmt/test_structure_fitting_tools.py \
            tests/molsysviewer_molsysmt/test_structure_center_tools.py \
            tests/molsysviewer_molsysmt/test_structure_move_away_tools.py \
            tests/molsysviewer_molsysmt/test_structure_axes_tools.py \
            tests/molsysviewer_molsysmt/test_structure_dihedral_tools.py \
            tests/molsysviewer_molsysmt/test_pbc_tools.py \
            tests/molsysviewer_molsysmt/test_pbc_edit_tools.py \
            tests/molsysviewer_molsysmt/test_physchem_tools.py
