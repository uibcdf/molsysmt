name: Documentation

on:
  release:
    types: ['released']

  workflow_dispatch:

env:
  SPHINXWORKING: True

jobs:
  sphinx_docs_to_gh-pages:
    runs-on: ubuntu-latest
    name: Sphinx docs to gh-pages
    permissions:
      contents: write    # the action pushes the compiled html to the gh-pages branch
    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Protect bundled scientific data
        shell: bash
        run: chmod -R a-w molsysmt/data

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
              - defaults
            channel_priority: strict
          create-args: >-
            python=3.14

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate docs
          micromamba info
          micromamba list

      # Install the controlled portable Viewer source without resolving its
      # MolSysMT dependency. docs_env.yaml supplies the shared runtime dependencies;
      # the exact pin is audited by devtools/dependency_contract.toml.
      - name: Install molsysviewer
        shell: bash -l {0}
        run: |
          python -m pip install --no-deps git+https://github.com/uibcdf/molsysviewer@cf427942d0b08a1c5c60f262c6a6b33f248d6f8b

      # Building the private extension needs only rustc/cargo. Pinning the minimal
      # toolchain here prevents rustup from processing the development-only Clippy and
      # rustfmt components in rust-toolchain.toml on partially provisioned runners.
      - name: Select the pinned minimal Rust toolchain
        shell: bash -l {0}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version

      - name: Install package
        shell: bash -l {0}
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          python -m pip install . --no-deps

      - name: Test import module
        shell: bash -l {0}
        run: |
          set -euo pipefail
          echo "::group::Importing module from home directory"
          trap 'echo "::endgroup::"' EXIT
          cd
          pwd
          python -c 'import molsysmt; print("Version of the package: {}".format(molsysmt.__version__))'

      - name: Running the Sphinx to gh-pages Action
        uses: uibcdf/action-sphinx-docs-to-gh-pages@v3.0.0
        with:
          branch: ''            # publish the reference this workflow checked out, not the tip of main
          sphinx-apidoc: false  # MolSysMT writes its own API reference under docs/api
          sphinx-opts: '-j auto'

      - name: Verify that documentation did not alter bundled data
        if: always()
        shell: bash
        run: git diff --exit-code -- molsysmt/data
