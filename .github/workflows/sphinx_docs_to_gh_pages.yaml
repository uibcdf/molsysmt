name: Documentation

on:
  release:
    types: ['released']

  workflow_dispatch:

env:
  SPHINXWORKING: True

jobs:
  sphinx_docs_to_gh-pages:
    runs-on: ubuntu-latest
    name: Sphinx docs to gh-pages
    permissions:
      contents: write    # the action pushes the compiled html to the gh-pages branch
    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
              - defaults
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate docs
          micromamba info
          micromamba list

      # MolSysViewer and MolSysMT declare each other as run dependencies, so installing
      # either from the uibcdf channel drags the other in — and neither has a py313 build
      # there yet. Installing both with --no-deps dissolves the cycle: every shared
      # dependency is already declared in docs_env.yaml. The viewer's built assets
      # (runtime_actions.json, viewer.js) are committed, so this needs no npm.
      # Remove this step once molsysviewer is published for py313; see
      # devguide/pending_proposals/molsysmt_1_0_conda_release_coordination.md.
      - name: Install molsysviewer
        shell: bash -l {0}
        run: |
          python -m pip install --no-deps git+https://github.com/uibcdf/molsysviewer@7a1522662e30575caf580a9447e3e6d80b628e07

      # Building the private extension needs only rustc/cargo. Pinning the minimal
      # toolchain here prevents rustup from processing the development-only Clippy and
      # rustfmt components in rust-toolchain.toml on partially provisioned runners.
      - name: Select the pinned minimal Rust toolchain
        shell: bash -l {0}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version

      - name: Install package
        shell: bash -l {0}
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          python -m pip install . --no-deps

      - name: Test import module
        shell: bash -l {0}
        run: |
          echo "::group::Importing module from home directory"
          cd
          pwd
          echo 'import molsysmt; print("Version of the package: {}".format(molsysmt.__version__))' | python
          echo "::endgroup::"

      - name: Running the Sphinx to gh-pages Action
        uses: uibcdf/action-sphinx-docs-to-gh-pages@v3.0.0
        with:
          branch: ''            # publish the reference this workflow checked out, not the tip of main
          sphinx-apidoc: false  # MolSysMT writes its own API reference under docs/api
          sphinx-opts: '-j auto'
