name: Ruff

on:
  push:
    branches:
      - "main"
    paths:
      - "molsysmt/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yaml"
      - "devtools/ruff_migrated_paths.txt"
  pull_request:
    branches:
      - "main"
    paths:
      - "molsysmt/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yaml"
      - "devtools/ruff_migrated_paths.txt"
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff lint checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.16.5

      - name: Check critical rules across the legacy core
        # The full common baseline is migrated under uibcdf/molsysmt#212.
        run: ruff check --select F821,F822,F823,B006,B023 molsysmt

      - name: Check migrated packages
        run: |
          mapfile -t migrated_paths < devtools/ruff_migrated_paths.txt
          test "${#migrated_paths[@]}" -gt 0
          ruff check "${migrated_paths[@]}"
          ruff format --check "${migrated_paths[@]}"
