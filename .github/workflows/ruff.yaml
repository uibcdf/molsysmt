name: Ruff

on:
  push:
    branches:
      - "main"
    paths:
      - "molsysmt/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "molsysmt/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yaml"
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff lint checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.16.5

      - name: Check Python source
        run: |
          ruff check .
          ruff format --check .
