name: Ruff

on:
  push:
    branches:
      - "main"
    paths:
      - "molsysmt/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "molsysmt/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yaml"
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff lint checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.16.5

      - name: Check critical rules across the legacy core
        # The full common baseline is migrated under uibcdf/molsysmt#212.
        run: ruff check --select F821,F822,F823,B006,B023 molsysmt

      - name: Check migrated packages
        run: |
          ruff check molsysmt/attribute
          ruff format --check molsysmt/attribute
          ruff check molsysmt/lib
          ruff format --check molsysmt/lib
          ruff check molsysmt/form/string_pdb_text
          ruff format --check molsysmt/form/string_pdb_text
          ruff check molsysmt/form/molsysmt_MolSys
          ruff format --check molsysmt/form/molsysmt_MolSys
          ruff check molsysmt/form/openff_Molecule
          ruff format --check molsysmt/form/openff_Molecule
          ruff check molsysmt/form/openff_Topology
          ruff format --check molsysmt/form/openff_Topology
          ruff check molsysmt/form/string_smiles
          ruff format --check molsysmt/form/string_smiles
          ruff check molsysmt/form/file_smi
          ruff format --check molsysmt/form/file_smi
          ruff check molsysmt/form/string_pdb_id
          ruff format --check molsysmt/form/string_pdb_id
          ruff check molsysmt/form/file_bcif
          ruff format --check molsysmt/form/file_bcif
          ruff check molsysmt/form/file_bcif_gz
          ruff format --check molsysmt/form/file_bcif_gz
