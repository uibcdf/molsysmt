name: CI full Linux

# Runs every Monday at 09:00 UTC and on manual dispatch.
# At 00:17 America/Mexico_City it runs only when skipped commits still need
# a successful full matrix. The backlog survives a missed or failed night.
# Manual probe_backlog checks the decision without launching the test matrix.
# Executes the full suite on Linux × {3.11, 3.12, 3.13, 3.14}
# and macOS arm64/Python 3.14 at least weekly.
# Coverage report is uploaded to Codecov from the Python 3.13 run only.
# All four accepted Python minors remain required on Linux.

on:
  schedule:
    - cron: "0 9 * * MON"
    - cron: "17 0 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      python_313_only:
        description: "Run the complete suite only on Linux/Python 3.13 for coverage; does not clear full-matrix debt"
        type: boolean
        required: false
        default: false
      probe_backlog:
        description: "Check the skipped-commit backlog without running tests"
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 0 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/scripts/nightly_full_gate.py

  full:
    name: Full test — ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    needs: nightly-decision
    if: >-
      always() && inputs.probe_backlog != true
      && (needs.nightly-decision.result != 'success' || needs.nightly-decision.outputs.run_full == 'true')
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The scheduled/default route keeps all four Linux minors and routine macOS arm64.
        # Only an explicit manual request selects the coverage uploader alone.
        cfg: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.python_313_only == true && '[{"os":"ubuntu-latest","python-version":"3.13"}]' || '[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-15","python-version":"3.14"}]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: uname -a

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.cfg.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=${{ matrix.cfg.python-version }}

      - name: Select the pinned minimal Rust toolchain
        shell: bash -l {0}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version

      - name: Install package
        shell: bash -l {0}
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          set -euo pipefail
          python -m pip install --no-deps \
            -r devtools/controlled_sources.txt \
            git+https://github.com/uibcdf/molsysviewer@cf427942d0b08a1c5c60f262c6a6b33f248d6f8b
          python -m pip install --editable . --no-deps

      - name: Validate controlled dependency versions
        shell: bash -l {0}
        run: python devtools/scripts/validate_controlled_dependencies.py

      - name: Test import
        shell: bash -l {0}
        run: |
          cd
          python -c "from argdigest import Domain, UnknownArgumentError"
          python -c "import molsysmt; print('Version:', molsysmt.__version__)"

      - name: Run fast release gates
        if: matrix.cfg.python-version == '3.14' || inputs.python_313_only == true
        shell: bash -l {0}
        run: python devtools/scripts/release_gate.py

      - name: Run scientific truth gate
        shell: bash -l {0}
        run: |
          python devtools/scripts/validate_scientific_evidence.py
          python -c "import MDAnalysis, mdtraj; print('MDAnalysis:', MDAnalysis.__version__); print('MDTraj:', mdtraj.__version__)"
          python devtools/scripts/execute_scientific_evidence.py \
            --receptor=ci \
            --require-clean \
            --certificate=scientific-evidence-certificate.json

      - name: Upload scientific evidence certificate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-scientific-evidence-py${{ matrix.cfg.python-version }}${{ matrix.cfg.os == 'macos-15' && '-macos-arm64' || '' }}
          path: scientific-evidence-certificate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run full test suite with coverage
        id: suite
        shell: bash -l {0}
        run: |
          set +e
          python -m pytest --receptor=ci \
            --cov-config=.coveragerc \
            --cov=molsysmt \
            --cov-report=xml \
            --junitxml=junit.xml
          pytest_status=$?
          echo "exit_code=$pytest_status" >> "$GITHUB_OUTPUT"
          exit "$pytest_status"

      - name: Retain coverage and test results
        if: >-
          !cancelled() && (steps.suite.outputs.exit_code == '0' || steps.suite.outputs.exit_code == '1')
        uses: actions/upload-artifact@v7
        with:
          name: full-suite-coverage-py${{ matrix.cfg.python-version }}${{ matrix.cfg.os == 'macos-15' && '-macos-arm64' || '' }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results to Codecov
        if: matrix.cfg.python-version == '3.13' && !cancelled()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report failure on scheduled CI
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::error title=Scheduled Full CI Failed::The scheduled full CI run on ${{ matrix.cfg.os }} (Python ${{ matrix.cfg.python-version }}) failed. Inspect the workflow logs to triage."

  coverage-upload:
    name: Publish default-branch coverage
    needs: full
    # Failed completed tests retain reports; the original test job stays failed.
    # Native provenance rejects aborted suites and missing artifacts.
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main'
      && (needs.full.result == 'success' || needs.full.result == 'failure')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/ci-coverage-upload.yaml
    with:
      source_run_id: ${{ github.run_id }}
