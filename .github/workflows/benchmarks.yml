name: Performance Regression Audit

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.ipynb'
      - 'docs/**'
      - 'paper/**'
      - 'examples/**'
      - 'logos/**'
  workflow_dispatch:

jobs:
  benchmark:
    name: Regression Audit — ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    if: >
      !(
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'skip-ci'))
      )
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 20
    env:
      BENCHMARK_EVIDENCE_DIR: .pytest_cache/benchmark-evidence
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.14" }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.cfg.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
            # Temporary runtime fence; removal requires #402 qualification.
            pinned_packages:
              - mkl<2026.2
          create-args: >-
            python=${{ matrix.cfg.python-version }}

      - name: Select the pinned minimal Rust toolchain
        shell: bash -l {0}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version

      - name: Install compiled source checkout
        shell: bash -l {0}
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          set -euo pipefail
          python -m pip install --no-deps \
            -r devtools/controlled_sources.txt \
            git+https://github.com/uibcdf/molsysviewer@e4dd58cf0edcb2c3afb2c982ccd50d3899d504ab
          python -m pip install --editable . --no-deps
          python devtools/scripts/validate_controlled_dependencies.py

      - name: Guard fresh-process reference preparation
        shell: bash -l {0}
        run: python -m pytest --receptor=ci devtools/tests/test_benchmark_reference.py

      - name: Extract Reference Baseline
        id: reference
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p "${BENCHMARK_EVIDENCE_DIR}"
          git rev-parse HEAD > "${BENCHMARK_EVIDENCE_DIR}/source_commit.txt"
          if ! git show origin/${{ github.base_ref || 'main' }}:benchmarks/baselines/competitor_matrix_session.json > "${BENCHMARK_EVIDENCE_DIR}/reference_session.json" 2>/dev/null; then
            echo "⚠️ Could not retrieve baseline from origin/${{ github.base_ref || 'main' }}. Using local baseline copy."
            cp benchmarks/baselines/competitor_matrix_session.json "${BENCHMARK_EVIDENCE_DIR}/reference_session.json"
          fi

      - name: Run Current Benchmarks
        shell: bash -l {0}
        run: |
          set -euo pipefail
          export SMONITOR_PROFILE="qa"
          python benchmarks/competitors/run_matrix.py --output "${BENCHMARK_EVIDENCE_DIR}/current_session.json" 2>&1 | tee "${BENCHMARK_EVIDENCE_DIR}/current.log"

      - name: Audit Performance Regressions
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python benchmarks/compare_runs.py --baseline "${BENCHMARK_EVIDENCE_DIR}/reference_session.json" --current "${BENCHMARK_EVIDENCE_DIR}/current_session.json" --threshold 0.15 2>&1 | tee "${BENCHMARK_EVIDENCE_DIR}/comparison.log"

      - name: Retain benchmark evidence after success or failure
        if: always() && steps.reference.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-${{ matrix.cfg.os }}-py${{ matrix.cfg.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pytest_cache/benchmark-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
