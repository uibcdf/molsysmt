name: Rust abi3 wheels

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "molsysmt/_private/rust_backend.py"
      - "devtools/scripts/validate_rust_wheel.py"
      - "devtools/scripts/validate_installed_rust_wheel.py"
      - "devtools/tests/test_validate_rust_wheel.py"
      - "devtools/tests/test_rust_wheel_workflow.py"
      - ".github/workflows/ci-rust-wheels.yaml"

permissions:
  contents: read

jobs:
  build-full:
    name: ${{ matrix.target.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            runner: macos-15
            arch: arm64
          - name: windows-x86_64
            runner: windows-2022
            arch: AMD64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select the pinned Rust toolchain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      - name: Install wheel tooling
        run: python -m pip install cibuildwheel==3.4.1 numpy

      - name: Build and audit the abi3 wheel
        env:
          CIBW_ARCHS: ${{ matrix.target.arch }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Validate the installed private extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: molsysmt-${{ matrix.target.name }}-abi3
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  test-full:
    name: ${{ matrix.target.name }} — Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    needs: build-full
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2022
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: molsysmt-${{ matrix.target.name }}-abi3
          path: wheelhouse

      - name: Install the current supported NumPy release
        run: python -m pip install "numpy>=1.26,<3"

      - name: Validate the installed abi3 extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

  test-numpy-floor:
    name: NumPy floor — Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    needs: build-full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            numpy: "numpy==1.26.4"
          - python: "3.12"
            numpy: "numpy==1.26.4"
          - python: "3.13"
            numpy: "numpy==2.1.3"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: molsysmt-linux-x86_64-abi3
          path: wheelhouse

      - name: Install the Python-specific NumPy floor
        run: python -m pip install "${{ matrix.numpy }}"

      - name: Validate the installed abi3 extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

  build-pull-request:
    name: linux-x86_64
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wheel tooling
        run: python -m pip install cibuildwheel==3.4.1 numpy

      - name: Build and audit the abi3 wheel
        env:
          CIBW_ARCHS: x86_64
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Validate the installed private extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: molsysmt-linux-x86_64-abi3
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  test-pull-request:
    name: linux-x86_64 — Python ${{ matrix.python }}
    if: github.event_name == 'pull_request'
    needs: build-pull-request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: molsysmt-linux-x86_64-abi3
          path: wheelhouse

      - name: Install the current supported NumPy release
        run: python -m pip install "numpy>=1.26,<3"

      - name: Validate the installed abi3 extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse
