name: Rust abi3 wheels

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "molsysmt/_private/rust_backend.py"
      - "devtools/scripts/validate_rust_wheel.py"
      - "devtools/scripts/validate_installed_rust_wheel.py"
      - "devtools/scripts/validate_installed_molsysmt.py"
      - "devtools/scripts/validate_rust_sdist.py"
      - "devtools/data/rust_exports.json"
      - "devtools/tests/test_validate_rust_wheel.py"
      - "devtools/tests/test_validate_rust_sdist.py"
      - "devtools/tests/test_rust_wheel_workflow.py"
      - ".github/workflows/ci-rust-wheels.yaml"

permissions:
  contents: read

jobs:
  rust-quality:
    name: Format, lint, test, dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint Rust kernels
        run: >-
          cargo clippy --manifest-path rust/Cargo.toml
          --no-default-features -- -D warnings

      - name: Test Rust kernels
        run: cargo test --manifest-path rust/Cargo.toml --no-default-features

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          rust-version: "1.97.1"
          command: check
          arguments: --all-features

  source-distribution:
    name: Source distribution round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      - name: Build and validate the source distribution
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
          python devtools/scripts/validate_rust_sdist.py dist

      - name: Build and validate a wheel from the source distribution
        run: |
          python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir sdist-wheelhouse
          python devtools/scripts/validate_rust_wheel.py sdist-wheelhouse
          python -m pip install numpy
          python devtools/scripts/validate_installed_rust_wheel.py sdist-wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: molsysmt-source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-full:
    name: ${{ matrix.target.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            runner: macos-15
            arch: arm64
          - name: windows-x86_64
            runner: windows-2022
            arch: AMD64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select the pinned Rust toolchain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      - name: Install wheel tooling
        run: python -m pip install cibuildwheel==3.4.1 numpy

      - name: Build and audit the abi3 wheel
        env:
          CIBW_ARCHS: ${{ matrix.target.arch }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Validate the installed private extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: molsysmt-${{ matrix.target.name }}-abi3
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  test-full:
    name: ${{ matrix.target.name }} — Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    needs: build-full
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2022
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: molsysmt-${{ matrix.target.name }}-abi3
          path: wheelhouse

      - name: Install the current supported NumPy release
        run: python -m pip install "numpy>=1.26,<3"

      - name: Validate the installed abi3 extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

  test-numpy-floor:
    name: NumPy floor — Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    needs: build-full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            numpy: "numpy==1.26.4"
          - python: "3.12"
            numpy: "numpy==1.26.4"
          - python: "3.13"
            numpy: "numpy==2.1.3"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: molsysmt-linux-x86_64-abi3
          path: wheelhouse

      - name: Install the Python-specific NumPy floor
        run: python -m pip install "${{ matrix.numpy }}"

      - name: Validate the installed abi3 extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

  test-public-smoke:
    name: Installed public smoke — Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    needs: build-full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: uibcdf/depdigest
          ref: 4fccafda4aa37b4c152d6b7d887ee665c7adc443
          path: controlled-sources/depdigest
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: uibcdf/smonitor
          ref: df86d5d33de23724a819c2cb883198522a0c0c47
          path: controlled-sources/smonitor
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: uibcdf/pyunitwizard
          ref: 0ff6656abfbd9f1ebc7575bc3f67fb263f52bf4f
          path: controlled-sources/pyunitwizard
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: uibcdf/argdigest
          ref: 8df5bfee6bbb22bc2cd40aa744f04f1fc1c76ade
          path: controlled-sources/argdigest
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: uibcdf/molsysviewer
          ref: 28ebc4a9b624d81c1a09d27ffb91e96c63d2cfc4
          path: controlled-sources/molsysviewer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: molsysmt-linux-x86_64-abi3
          path: wheelhouse

      - name: Install controlled hard dependencies
        run: >-
          python -m pip install
          controlled-sources/depdigest
          controlled-sources/smonitor
          controlled-sources/pyunitwizard
          controlled-sources/argdigest
          controlled-sources/molsysviewer
          h5py pandas networkx tqdm matplotlib

      - name: Install the MolSysMT wheel without dependency resolution
        run: python -m pip install --no-deps wheelhouse/*.whl

      - name: Validate the installed public runtime outside the checkout
        shell: bash
        run: >-
          cd "${RUNNER_TEMP}" &&
          python "${GITHUB_WORKSPACE}/devtools/scripts/validate_installed_molsysmt.py"

  build-pull-request:
    name: linux-x86_64
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wheel tooling
        run: python -m pip install cibuildwheel==3.4.1 numpy

      - name: Build and audit the abi3 wheel
        env:
          CIBW_ARCHS: x86_64
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Validate the installed private extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: molsysmt-linux-x86_64-abi3
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  test-pull-request:
    name: linux-x86_64 — Python ${{ matrix.python }}
    if: github.event_name == 'pull_request'
    needs: build-pull-request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: molsysmt-linux-x86_64-abi3
          path: wheelhouse

      - name: Install the current supported NumPy release
        run: python -m pip install "numpy>=1.26,<3"

      - name: Validate the installed abi3 extension
        run: >-
          python devtools/scripts/validate_installed_rust_wheel.py
          wheelhouse
