name: Verify one public conda package (read-only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published three-part version
        required: true
        type: string
      target:
        description: Native platform of the exact ABI3 artifact
        required: true
        type: choice
        options: [linux-64, linux-aarch64, osx-arm64, win-64]
      filename:
        description: Exact public Conda filename
        required: true
        type: string
      sha256:
        description: Expected immutable SHA-256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify public label and solver-visible index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact public file without promotion
        id: public_verification
        uses: uibcdf/molsyssuite/.github/actions/verify-public-conda@399d33a4ee0da148571cba7cfc004e3f3a2e71e7
        with:
          package: molsysmt
          version: ${{ inputs.version }}
          subdir: ${{ inputs.target }}
          filename: ${{ inputs.filename }}
          sha256: ${{ inputs.sha256 }}

      - name: Retain independent public verification evidence
        if: ${{ always() && steps.public_verification.outputs.evidence-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysmt-independent-public-conda-${{ inputs.version }}
          path: ${{ steps.public_verification.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
