  admonition_hint: ":::{hint}\n:class: dropdown\n**msm.get_form()**: Identifies the form (e.g. 'file:pdb', 'mdtraj.Trajectory', 'molsysmt.MolSys') of any molecular item. See API doc: {func}`molsysmt.basic.get_form`.\n:::"

