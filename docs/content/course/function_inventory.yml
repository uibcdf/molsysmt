# Central Function Inventory for MolSysMT Master Course
# Maps every public MolSysMT function to its first introduction module, canonical summary, and Sphinx API reference.

molsysmt.basic.convert:
  name: "msm.convert"
  first_introduced_in: "Common_Core/01_The_Form_Agnostic_Philosophy.ipynb"
  summary: "Converts a molecular system between any of the 89 supported forms in memory or on disk."
  doc_ref: "{func}`molsysmt.basic.convert`"
  admonition_hint: ":::{hint}\n:class: dropdown\n**msm.convert()**: Converts a molecular system between any supported forms (files, MDTraj, OpenMM, RDKit, native objects). See API doc: {func}`molsysmt.basic.convert`.\n:::"

