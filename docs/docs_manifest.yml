          file: docs/content/user/tools/molsysviewer_tools.md
          agents_file: docs/content/user/tools/molsysviewer_tools.md.AGENTS.md
          description: Experimental expert MolSysViewer addon with native basic tools, two topology and nine chemical-state paths, twenty-eight structure, thirteen PBC, thirty-four physchem and fifteen canonical interaction paths at the recorded baseline; eleven build diagnostics, three detached covalent/type/charge preparation routes, independent export-name projection with identity maps and protected shared geometry, declared biological assemblies and explicit AutoDock4 nonpolar-H projection with charge/provenance maps, independent declared terminal attachment with historical reports and bounded standard/curated heavy-atom repair with native attribute/invalidation policies, independent hydrogen generation with distinct legacy/fixed-state contracts and historical H5MSM evidence, native terminal completion/capping with explicit chemistry/provider limits, detached native builder staging without mechanics/analyses and conditional overlap-filter ownership with explicit candidate/reference and structure scope, fresh peptide construction from the loaded sequence and independent bounded substitutions with explicit reconstruction and mask limitations, native missing-bond addition with managed reference-state graph publication, true no-op preservation and synchronization-only recovery; native alternate-site coordinate/B-factor/ID publication with retained indices, explicit occupancy/partial-write limits and no scientific replay; managed edits and synchronization recovery; independent atom maps/order, four system-composition mirrors with managed prefix additions and native partial-write limits, seven explicit H5MSM file utilities, two raw FASTA occurrence readers and eight explicit element/atom/group label utilities with empty-view access and no molecular binding; twenty-one current-primary element paths preserve native projections without assignment, stable versus chemical-state ownership and the limits of the legacy amino-acid name heuristic; fourteen additional explicit name/type/code helpers preserve scalar lookup semantics and the received canonical/protected-end conventions and remaining legacy-name qualification limits. Fourteen explicit reference-template queries complete the reviewed element surface, preserving index labels, received native index-map validation and structured diagnostics, native family data layouts and fixed chemical-context rules without preparation or scene changes. Four molecular-mechanics tools provide explicit engine-resource lookup, primary-bound degree counting, total/decomposed potential energy and native minimization, preserving physical units, independent output defaults, managed retained-axis coordinate publication, saved-analysis invalidation and synchronization-only retry. Source exposure and bounded receiving retain native scientific prerequisites, provider limits and separate installed qualification. Conversion and preflight retain explicit from_naming_scheme with native loss/conflict handling. Source-aware code lookup uses element.group with naming_scheme; retired amino-acid scalar paths are not preserved as aliases.
