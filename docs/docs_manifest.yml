          description: Experimental expert MolSysViewer addon with native basic tools, three topology and nine chemical-state paths, twenty-eight structure, thirteen PBC, thirty-five physchem and fifteen canonical interaction paths at the recorded baseline; eleven build diagnostics, three detached covalent/type/charge preparation routes, independent export-name projection with identity maps and protected shared geometry, declared biological assemblies and explicit AutoDock4 nonpolar-H projection with charge/provenance maps, independent declared terminal attachment with historical reports and bounded standard/curated heavy-atom repair with native attribute/invalidation policies, independent hydrogen generation with distinct legacy/fixed-state contracts and historical H5MSM evidence, native terminal completion/capping with explicit chemistry/provider limits, detached native builder staging without mechanics/analyses and conditional overlap-filter ownership with explicit candidate/reference and structure scope, fresh peptide construction from the loaded sequence and independent bounded substitutions with explicit reconstruction and mask limitations, independent engine-selected solvation with explicit preparation/model requirements, direct OpenMM parity and bounded water/box geometry, public source-bound protonation assessment and independent/managed reconciliation with bidirectional atom maps, native named-state/unassessed limits and synchronization-only scene recovery, native missing-bond addition with managed reference-state graph publication, true no-op preservation and synchronization-only recovery; native alternate-site coordinate/occupancy/B-factor/ID publication with retained indices, consistent stable labels, whole-request scientific preflight and bounded adapter-failure limits without scientific replay; managed edits and synchronization recovery; independent atom maps/order, four system-composition mirrors with managed prefix additions and native partial-write limits, seven explicit H5MSM file utilities, two raw FASTA occurrence readers and eight explicit element/atom/group label utilities with empty-view access and no molecular binding; twenty-one current-primary element paths preserve native projections without assignment, stable versus chemical-state ownership and the limits of the legacy amino-acid name heuristic; fourteen additional explicit name/type/code helpers preserve scalar lookup semantics and the received canonical/protected-end conventions and remaining legacy-name qualification limits. Fourteen explicit reference-template queries complete the reviewed element surface, preserving index labels, received native index-map validation and structured diagnostics, native family data layouts and fixed chemical-context rules without preparation or scene changes. Six molecular-mechanics tools provide explicit engine-resource lookup, primary-bound degree counting, total/decomposed potential energy, complete-model atomic forces with explicit ordered structure axes and native unit/model contracts, internal/cross nonbonded contributions with bounded NoCutoff pair references and explicit partition limits, and native minimization, preserving physical units, independent output defaults, managed retained-axis coordinate publication, saved-analysis invalidation and synchronization-only retry. Independent visualization through basic.view preserves native selectors/backends and caller lifetime; four historical hbonds routes alias canonical bound methods, while native MD stubs remain unavailable. Repaired mutation atom-axis selection and native digestion are forwarded without consumer translation. An explicit CCD reference factory keeps source authority, descriptor/H policy and coordinate-free output separate from exact-name/element query/reference maps and chemical-template assessment. Source exposure and bounded receiving retain native scientific prerequisites, provider limits and separate installed qualification. Conversion and preflight retain explicit from_naming_scheme with native loss/conflict handling. Source-aware code lookup uses element.group with naming_scheme; retired amino-acid scalar paths are not preserved as aliases. Explicit-input water construction works before loading and returns independent native output without adoption or equilibration claims. Independent native whole-water ion replacement retains explicit charge/seed/clearance controls and bidirectional reports without scene adoption; solvation now forwards native seed/digestion and receives identifier/count repairs. Resource lookup returns independent lists and distinguishes physical OBC models, with canonical shared OpenMM attribution metadata after #583. Native platform resolution distinguishes invalid names, unavailable registration and device failures without fallback; CPU/Reference execution has bounded consumer qualification, with GPU execution separate. The experimental System panel reviews explicit selections and applies qualified all-structure atom removal with atomic single-use confirmation and host-only reconciliation recovery. Source Geometry offers reviewed coordinate transforms and bounded periodic tools; Chemistry adds explicit-state stored-information and hydrogen inspection with native coverage and 50-row pages, alongside separate heavy-atom and hydrogen preparation tasks with explicit methods, native prerequisites, independent results and reviewed conditional scene-reset replacement. Analysis adds native distances, minimum/maximum separations and cutoff/nearest-count neighborhoods with explicit source axes and centers, ordered/repeated structures, 50-row nm pages and native disk-result retirement. Conformational tasks add raw/optimal RMSD, gyration and per-atom RMSF with explicit reference correspondence, native units and complete-canonical-axis-only core plot adoption without implicit alignment or scientific replay. Declared pending readers remain usable in the recovery sheet with scene isolation