[pytest]
# Paths to search for test discovery (unit tests + doctests in source)
testpaths =
    tests
    molsysmt/basic

# Enable doctests in docstrings for all modules
addopts = --doctest-modules -q

# Make doctests more robust: ignore whitespace diffs and allow ellipsis
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Custom marks
markers =
    network: tests that require a live network connection (PDB/AlphaFold downloads)
    xdist_group: pytest-xdist group label — tests with the same group run in the same worker (serialized)
    tier1: form or function is Tier 1 (contractual, 1.x stable)
    tier2: form or function is Tier 2 (best-effort, not contractually guaranteed)
    tier3: form or function is Tier 3 (experimental / niche, outside 1.0.0 core)
    redundant: test exercises a delegation path already covered by a lower-level suite
    peptide_parity: extended LEaP vs MolSysMT builder parity suite (40 random sequences, requires tleap)
    heavy: tests for heavy (chunked) trajectory processing (deselect with '-m "not heavy"')

# Exclude unnecessary directories from test discovery
norecursedirs =
    dist
    *.egg-info
    .tox
    .venv
    docs/_build
