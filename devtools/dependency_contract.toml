# Runtime requirements and floors are authoritative in pyproject.toml.
# This file declares where those requirements must be represented, not a
# second list of packages or versions.
schema = 1
controlled_sources = "devtools/controlled_sources.txt"
runtime_extras = ["soft"]

[conda_names]
mmcif = "py-mmcif"
openff-toolkit = "openff-toolkit-base"

[recipes]
conda_build = "devtools/conda-build/meta.yaml"
rattler_build = "devtools/rattler-build/recipe.yaml"

[[environments]]
path = "devtools/conda-envs/production_env.yaml"
source_supplied = []

[[environments]]
path = "devtools/conda-envs/development_env.yaml"
source_supplied = []
optional_required = ["mdtraj", "pyparsing", "openff-toolkit", "openff-units"]

[[environments]]
path = "devtools/conda-envs/test_env.yaml"
source_supplied = ["argdigest", "depdigest", "smonitor", "pyunitwizard", "molsysviewer"]
optional_required = ["mdtraj", "pyparsing", "openff-toolkit", "openff-units"]

[[environments]]
path = "devtools/conda-envs/docs_env.yaml"
source_supplied = ["molsysviewer"]

[[excluded_environments]]
path = "devtools/conda-envs/build_env.yaml"
reason = "Build tools only; it does not install the MolSysMT runtime."

[[excluded_environments]]
path = "devtools/conda-envs/setup_env.yaml"
reason = "Build bootstrap only; it does not install the MolSysMT runtime."

[[excluded_environments]]
path = "devtools/conda-envs/importable_env.yaml"
reason = "Installs the published MolSysMT package with normal dependency resolution."

[workflow_sources]
controlled = [
  ".github/workflows/benchmarks.yml",
  ".github/workflows/ci-smoke.yaml",
  ".github/workflows/ci-weekly.yaml",
  ".github/workflows/ci-full.yaml",
  ".github/workflows/ci-rust-wheels.yaml",
]

[routine_viewer_source]
# Main-branch smoke/docs use a known source revision while release candidates
# supply their exact Viewer SHA as a workflow input.
sha = "42234de839ed047016f8f241ea5eb717cfeb07be"
workflows = [
  ".github/workflows/benchmarks.yml",
  ".github/workflows/ci-smoke.yaml",
  ".github/workflows/ci-weekly.yaml",
  ".github/workflows/sphinx_docs_to_gh_pages.yaml",
]
