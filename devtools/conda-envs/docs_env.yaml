channels:
  - uibcdf
  - conda-forge
dependencies:
  - python
  - pip
  - setuptools >=68.0
  - versioningit >=3.0
  # Bounds identical to the `dependencies` list in pyproject.toml. Without them the
  # solver silently satisfies conda while violating the package: with python 3.12 it
  # resolved pyunitwizard 0.17.0 against a requirement of >=0.22.0, because the uibcdf
  # channel only builds py313 from 0.18.1 onwards, and `pip install . --no-deps` does
  # not check. An unsolvable environment is the correct failure here.
  - numpy >=1.26,<3
  - pandas
  - h5py
  - networkx
  - tqdm
  # `pip install . --no-deps` installs none of MolSysMT's own dependencies, and autodoc
  # imports the package, so every hard dependency must be here. matplotlib is imported at
  # module scope by molsysmt/_private/colors.py, which third_party.nglview reaches.
  # molsysviewer, the one remaining hard dependency, is deliberately absent here: it has
  # no py313 build on the channel, and its recipe requires molsysmt at run time, so conda
  # cannot install it without pulling a MolSysMT that this job then overwrites. The
  # workflow installs it with `pip --no-deps` instead, which means its own dependencies
  # must be listed here too. It shares all of them with MolSysMT except these three.
  - anywidget >=0.9.15
  - traitlets >=5
  - packaging >=23
  # scipy is nobody's declared dependency and everybody's import: configuring
  # PyUnitWizard's pint form imports pint, and pint imports scipy. Both MolSysMT and
  # MolSysViewer do that configuration at import time.
  - scipy
  - matplotlib
  - argdigest >=0.11.0
  - depdigest >=0.10.0
  - smonitor >=0.12.0
  - pyunitwizard >=0.22.0
  - sphinx
  - pydata-sphinx-theme
  - myst-nb
  - sphinx-design
  - sphinx-copybutton
  - sphinx-favicon
  - sphinx-togglebutton
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
