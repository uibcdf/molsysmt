context:
  version: ${{ env.get("MOLSYSMT_RATTLER_VERSION") }}

package:
  name: molsysmt
  version: ${{ version }}

source:
  path: ../..
  use_gitignore: true

build:
  number: 0
  string: pyabi3h${{ hash }}_${{ build_number }}
  python:
    version_independent: true
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  build:
    - if: linux
      then: ${{ compiler("c") }}
    - ${{ compiler("rust") }}
  host:
    - python 3.11.*
    - python-abi3 3.11.*
    - pip
    - setuptools >=77.0.3
    - setuptools-rust >=1.10
    - versioningit >=3.0
  run:
    - python >=3.11,<3.15
    - h5py >=3.11.0
    - numpy >=1.26,<3
    - argdigest >=0.14.0
    - depdigest >=0.15.1
    - smonitor >=0.16.0
    - pyunitwizard >=0.28.1
    - pandas >=2.2.2
    - molsysviewer
    - networkx >=3.3
    - tqdm >=4.65.0
    - matplotlib >=3.8.4
    - py-mmcif >=1.1.1

tests:
  - python:
      imports:
        - molsysmt
        - molsysmt._rust

about:
  homepage: https://uibcdf.org
  repository: https://github.com/uibcdf/MolSysMT
  documentation: https://uibcdf.org/MolSysMT
  license: MIT
  summary: >-
    Molecular Systems Multi-Toolkit: build, prepare, query, transform, analyse and
    visualise molecular systems through one uniform API.
  description: >-
    MolSysMT is a toolkit for working with molecular systems. One uniform API lets
    users build, prepare, query, modify, analyse, and visualise molecular systems
    while interoperating with other molecular modelling libraries and file formats.
