[build-system]
# `wheel` is not required here; setuptools will build wheels without adding it.
requires = ["setuptools>=68.0", "versioningit>=3.0", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

# Self-descriptive entries which should always be present
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "molsysmt"
description = "A molecular systems multi-toolkit for converting, manipulating, and analysing biomolecular models and trajectories."
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "UIBCDF Lab", email = "uibcdf@gmail.com" }
]
license = { text = "MIT" }
# See https://pypi.org/classifiers/
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11.0,<3.14.0"
# Declare any run-time dependencies that should be installed with the package.
dependencies = [
    "h5py",
    "numpy>=1.26,<3",
    "pyunitwizard>=0.22.0",
    "pandas",
    "molsysviewer",
    "networkx",
    "tqdm",
    "matplotlib",
    "argdigest>=0.9.3",
    "depdigest>=0.10.0",
    "smonitor>=0.11.6",
]
keywords = ["molecular-dynamics", "structural-biology", "chemistry", "trajectory", "conversion"]

# Update the urls once the hosting is set up.
[project.urls]
"Source" = "https://github.com/uibcdf/MolSysMT/"
"Documentation" = "https://uibcdf.org/MolSysMT"
"Issues" = "https://github.com/uibcdf/MolSysMT/issues"

[project.entry-points."molsysviewer.addons"]
molsysmt = "molsysviewer_molsysmt"

[project.optional-dependencies]
soft = [
  "mdtraj",
  "openmm",
  "openmmtools",
  "MDAnalysis",
  "rdkit",
  "parmed",
  "pytraj",
  "nglview",
  "pdbfixer",
  "biopython",
  "plotly"
]
test = [
  "pytest>=6.1.2",
  "pytest-runner"
]
docs = [
  "sphinx",
  "myst-parser",
  "sphinx-rtd-theme"
]
dev = [
  "black",
  "isort",
  "pytest>=6.1.2",
  "pytest-cov",
  "ruff"
]

[tool.setuptools]
# This subkey is a beta stage development and keys may change in the future, see https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html for more details
#
# As of version 0.971, mypy does not support type checking of installed zipped
# packages (because it does not actually import the Python packages).
# We declare the package not-zip-safe so that our type hints are also available
# when checking client code that uses our (installed) package.
# Ref:
# https://mypy.readthedocs.io/en/stable/installed_packages.html?highlight=zip#using-installed-packages-with-mypy-pep-561
zip-safe = false
# Let setuptools discover the package in the current directory,
# but be explicit about non-Python files.
# See also:
#   https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#setuptools-specific-configuration
# Note that behavior is currently evolving with respect to how to interpret the
# "data" and "tests" subdirectories. As of setuptools 63, both are automatically
# included if namespaces is true (default), even if the package is named explicitly
# (instead of using 'find'). With 'find', the 'tests' subpackage is discovered
# recursively because of its __init__.py file, but the data subdirectory is excluded
# with include-package-data = false and namespaces = false.
include-package-data = false
[tool.setuptools.packages.find]
namespaces = true
where = ["."]

# Ref https://setuptools.pypa.io/en/latest/userguide/datafiles.html#package-data
[tool.setuptools.package-data]
molsysmt = [
    "py.typed"
]
"molsysmt.data" = ["**"]

[[tool.setuptools-rust.ext-modules]]
target = "molsysmt._rust"
path = "rust/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"
features = ["extension-module"]

[tool.distutils.bdist_wheel]
py-limited-api = "cp311"

[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux*"
build-verbosity = 1

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1"
environment = { PATH = "$HOME/.cargo/bin:$PATH", RUSTUP_TOOLCHAIN = "1.97.1" }
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "molsysmt/_version.py"

[tool.pytest.ini_options]
markers = [
    "heavy: marks tests that require heavy trajectory processing (deselect with '-m \"not heavy\"')",
]

[tool.ruff]
target-version = "py311"
exclude = [
    "molsysmt/third_party",
    "molsysmt/molecular_dynamics",
    "molsysmt/form",
]

[tool.ruff.lint]
select = ["F821", "F822", "F823", "B006", "B023"]

#[tool.flit.external-data]
#directory = "data"
