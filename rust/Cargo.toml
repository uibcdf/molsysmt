[package]
name = "molsysmt-rust"
version = "0.1.0"
edition = "2021"
description = "Private native kernels distributed as part of MolSysMT."
license = "MIT"

[lib]
name = "_rust"
# rlib is needed so `cargo test` can build a test harness for the unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"
rayon = "1.10"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
faer = "0.24.4"

# `extension-module` must be off when running `cargo test` (otherwise the test binary
# cannot link the Python symbols). Build the wheel with the default features on;
# run unit tests with `cargo test --no-default-features`.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true

# Deliberately no `target-cpu`: the wheel must run on any x86-64 baseline, and raising it
# buys nothing. Measured on every hot kernel, baseline == x86-64-v2 == x86-64-v3 (AVX2+FMA)
# within noise, because the hot loops are bound by dependency chains and memory traffic, not
# vector width. What *did* matter was that the baseline has no floor/round instruction
# (`roundsd` is SSE4.1), so `f64::floor` was lowering to a libm call inside the innermost
# loops — see `mathlib::fast_floor`. A fixed v3 baseline would also crash at import on
# pre-AVX2 CPUs. Full numbers and the multiversioning decision:
# devguide/rust_kernel_optimization_guide.md section 6.
