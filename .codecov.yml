# Codecov configuration

coverage:
  status:
    patch: false
    project:
      default:
        target: 75%
        threshold: 2%
  range: 50...85
  round: down
  precision: 2

comment:
  layout: "header"
  require_changes: false
  branches: null
  behavior: default
  flags: null
  paths: null

flags:
  unittests:
    paths:
      - molsysmt/
    carryforward: true

ignore:
  - "molsysmt/molecular_dynamics/**"
  # Piped getter files — generated delegation code, excluded from coverage
  - "molsysmt/form/string_pdb_id/get_topological_attributes.py"
  - "molsysmt/form/string_alphafold_id/get_topological_attributes.py"
  - "molsysmt/form/string_pdb_text/get_topological_attributes.py"
  - "molsysmt/form/string_smiles/get_topological_attributes.py"
  - "molsysmt/form/file_pdb/get_topological_attributes.py"
  - "molsysmt/form/file_bcif/get_topological_attributes.py"
  - "molsysmt/form/file_bcif_gz/get_topological_attributes.py"
  - "molsysmt/form/file_cif/get_topological_attributes.py"
  - "molsysmt/form/file_cif_gz/get_topological_attributes.py"
  - "molsysmt/form/file_prmtop/get_topological_attributes.py"
  - "molsysmt/form/file_psf/get_topological_attributes.py"
  - "molsysmt/form/file_smi/get_topological_attributes.py"
  - "molsysmt/form/file_topology_yaml/get_topological_attributes.py"
  - "molsysmt/form/MDAnalysis_AtomGroup/get_topological_attributes.py"
  - "molsysmt/form/mmcif_PdbxContainers_DataContainer/get_topological_attributes.py"
  - "molsysmt/form/mmtf_MMTFDecoder/get_topological_attributes.py"
  - "molsysmt/form/molsysmt_GROFileHandler/get_topological_attributes.py"
