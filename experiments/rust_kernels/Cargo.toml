[package]
name = "msm_rust_kernels"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust reimplementation of selected MolSysMT numeric kernels (Numba-replacement pilot). Self-contained; not part of the molsysmt build."

[lib]
name = "msm_rust_kernels"
# rlib is needed so `cargo test` can build a test harness for the unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"] }
numpy = "0.23"
rayon = "1.10"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
faer = "0.24.4"

# `extension-module` must be off when running `cargo test` (otherwise the test binary
# cannot link the Python symbols). Build the wheel with the default features on;
# run unit tests with `cargo test --no-default-features`.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true

# Deliberately no `target-cpu`: the wheel must run on any x86-64 baseline. Raising it to
# `x86-64-v3` (AVX2) was measured and is NOT a free win — it gives 1.1-1.3x on the cell-list
# kernels but a 16-25% regression on the dense `mic_distances` path, and it would crash at
# import on pre-AVX2 CPUs. If wide SIMD is ever wanted, do it with runtime multiversioning
# per kernel, gated by that kernel's own benchmark. See
# devguide/pending_proposals/rust_kernel_redesign_beyond_faithful_ports.md section 4.F.
