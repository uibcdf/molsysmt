[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "msm_rust_kernels"
version = "0.1.0"
description = "Experimental Rust kernels for MolSysMT (Numba-replacement pilot)."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
module-name = "msm_rust_kernels"
# This crate is an isolated experiment: it is NOT wired into molsysmt's build and
# molsysmt never imports it. It is built/installed on demand via `maturin develop`
# only inside this worktree, purely to benchmark Rust vs Numba kernels.
